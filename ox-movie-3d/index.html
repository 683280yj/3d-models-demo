  const skull=new THREE.Mesh(new THREE.SphereGeometry(0.55,24,18),c); skull.scale.set(1.0,0.95,0.9); skull.castShadow=true; head.add(skull);
  const muzzle=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.42,0.6,20),sn); muzzle.rotation.z=Math.PI/2; muzzle.position.set(0.5,0.05,0); muzzle.castShadow=true; head.add(muzzle);
  [-0.12,0.12].forEach(z=>{const n=new THREE.Mesh(new THREE.SphereGeometry(0.06,10,8),M(0x2a1a12)); n.position.set(0.8,0.05,z); head.add(n);});
  [-0.28,0.28].forEach(z=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,10),eye); e.position.set(0.35,0.18,z); head.add(e);});
  [-0.5,0.5].forEach(z=>{const ear=new THREE.Mesh(new THREE.SphereGeometry(0.18,12,10),cd); ear.scale.set(0.6,1.1,0.4); ear.position.set(-0.1,0.45,z); ear.rotation.z=z>0?0.5:-0.5; head.add(ear);});
  [-1,1].forEach(s=>{
    const h=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.75,16),hn); h.position.set(-0.15,0.5,s*0.32); h.rotation.z=s*0.5; h.rotation.x=-0.3; h.castShadow=true; head.add(h);
    const tip=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.4,14),hn); tip.position.set(-0.35,0.85,s*0.5); tip.rotation.z=s*0.7; tip.rotation.x=-0.5; head.add(tip);
  });
  const legs=[]; const legPos=[[1.0,0.55],[1.0,-0.55],[-0.95,0.55],[-0.95,-0.55]];
  legPos.forEach(([x,z])=>{
    const lg=new THREE.Group(); lg.position.set(x,1.15,z); g.add(lg);

  [-0.28,0.28].forEach(z=>{const d=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,6),

  g.scale.setScalar(scale);
  return {g, head, legs, tail, tears};
}

const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
function lerp3(a,b,k){return [lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];}
function sample(arr,t){
  if(t<=arr[0].t) return arr[0];
  for(let i=0;i<arr.length-1;i++){
    if(t>=arr[i].t && t<=arr[i+1].t){
      const k=ease((t-arr[i].t)/(arr[i+1].t-arr[i].t));
      return { p:arr[i].p.map((v,j)=>lerp(v,arr[i+1].p[j],k)),
               l:arr[i].l.map((v,j)=>lerp(v,arr[i+1].l[j],k)) };
    }
  }
  return arr[arr.length-1];
}
// 跃迁弧线：x0→x1，弧高 h
function leap(x0,x1,t0,t1,t,h=2.2){
  if(t<=t0) return {x:x0,y:0};
  if(t>=t1) return {x:x1,y:0};
  const k=ease((t-t0)/(t1-t0));
  return {x:lerp(x0,x1,k), y:Math.sin(Math.PI*k)*h};
}

// ---------- 程序化音乐（Web Audio，离线） ----------
let actx=null, musicOn=true, musicGain=null, arpTimer=null;
const PENTA=[523.25,587.33,659.25,783.99,880.0]; // C5 D5 E5 G5 A5
let arpIdx=0, nextNote=0;
function startAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ return; }
  musicGain=actx.createGain(); musicGain.gain.value=0; musicGain.connect(actx.destination);
  const padFilter=actx.createBiquadFilter(); padFilter.type='lowpass'; padFilter.frequency.value=620; padFilter.connect(musicGain);
  [110,164.81].forEach((f,i)=>{
    const o=actx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=actx.createGain(); g.gain.value=0.5; o.connect(g); g.connect(padFilter); o.start();
    const lfo=actx.createOscillator(); lfo.frequency.value=0.07+i*0.03;
    const lg=actx.createGain(); lg.gain.value=0.25; lfo.connect(lg); lg.connect(g.gain); lfo.start();
  });
  musicGain.gain.linearRampToValueAtTime(musicOn?0.5:0.0, actx.currentTime+1.5);
  scheduleArp();
}
function scheduleArp(){
  if(!actx) return;
  const now=actx.currentTime;
  if(nextNote<now) nextNote=now+0.1;
  while(nextNote < now+0.3){
    playNote(PENTA[arpIdx%PENTA.length], nextNote, 0.5);
    arpIdx += (Math.random()<0.5?1:2);
    nextNote += 0.5;
  }
  arpTimer=setTimeout(scheduleArp, 120);
}
function playNote(freq,when,dur){
  const o=actx.createOscillator(); o.type='sine'; o.frequency.value=freq;
  const g=actx.createGain(); g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(0.075,when+0.02); g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(g); g.connect(musicGain); o.start(when); o.stop(when+dur+0.05);
}
function thud(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(220,now); o.frequency.exponentialRampToValueAtTime(40,now+0.25);
  const g=actx.createGain(); g.gain.setValueAtTime(0.5,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.4);
  o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now+0.45);
  const buf=actx.createBuffer(1, Math.floor(actx.sampleRate*0.15), actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const n=actx.createBufferSource(); n.buffer=buf;
  const ng=actx.createGain(); ng.gain.value=0.25; n.connect(ng); ng.connect(actx.destination); n.start(now);
}
document.getElementById('music').onclick=()=>{
  musicOn=!musicOn;
  document.getElementById('music').textContent = musicOn?'🔊 音乐':'🔇 静音';
  if(musicGain&&actx) musicGain.gain.linearRampToValueAtTime(musicOn?0.5:0.0, actx.currentTime+0.4);
};

// ---------- 主循环 ----------
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(ui.playing){
    ui.t+=dt;
    if(ui.t>=TOTAL){ ui.t=TOTAL; setPlay(false); }
  }
  const t=ui.t;

  // 妈：先跳河
  let m;
  if(t<6) m={x:-8,y:0};
  else if(t<9) m=leap(-8,8,6,9,t,2.4);
  else m={x:8,y:0};
  mom.g.position.set(m.x,m.y,-1.5); mom.g.rotation.y=Math.PI; // 面朝牛来
  // 妈腿：跳跃时收腿，其余 idle
  mom.legs.forEach((L,i)=>{ L.g.rotation.z = (t>=6&&t<9)? -0.5 : Math.sin(t*1.5+i)*0.04; });

  // 牛来：不敢跳，被蛇吓到后跳过去撞树
  let b;
  if(t<23) b={x:-8,y:0};
  else if(t<25.5) b=leap(-8,9,23,25.5,t,2.6);
  else b={x:9,y:0};
  bull.g.position.set(b.x,b.y,1.5); bull.g.rotation.y=0;
  let headX=0;
  if(t>=16.5 && t<20.2) headX=0.35;      // 低头拒绝
  if(t>=25.2 && t<30) headX=-0.25;       // 撞晕
  bull.head.rotation.x = headX;
  bull.tears.visible = (t>=16.5&&t<20.2)||(t>=30&&t<31.9);
  const bullJump = (t>23 && t<25.5);
  bull.legs.forEach((L,i)=>{
    if(bullJump){ L.g.rotation.z=-0.6; L.lo.rotation.z=0.9; }            // 收腿起跳
    else if(t>16.5 && t<20.5) L.g.rotation.z=Math.sin(t*6+i)*0.12;      // 紧张抖腿
    else L.g.rotation.z=Math.sin(t*1.5+i)*0.04;
  });

  // 爸：撞树后才出现
  dad.g.visible = t>=27;
  if(t>=27){ dad.g.position.set(10.6,0,0.7); dad.g.rotation.y=Math.PI; }
  dad.legs.forEach((L,i)=>{ L.g.rotation.z=Math.sin(t*1.5+i)*0.04; });

  // 蛇：报信时出现并扭动
  snake.visible = t>=20.5;
  if(snake.visible) snake.rotation.y = Math.sin(t*4)*0.15;

  // 云雀：飞入→悬停报信→飞走
  bird.visible = t>=20 && t<27.5;
  if(bird.visible){
    let bp;
    if(t<22.5) bp=lerp3([-14,6,-4],[-7,2.6,2], ease((t-20)/2.5));
    else if(t<25) bp=[-7+Math.sin(t*3)*0.1, 2.6+Math.sin(t*4)*0.1, 2];
    else bp=lerp3([-7,2.6,2],[-14,8,-6], ease((t-25)/2.5));
    bird.position.set(bp[0],bp[1],bp[2]);
    bird.rotation.y = (t<25)? -0.4 : 0.5;
    const flap=Math.sin(t*20)*0.7; wl.rotation.x=flap; wr.rotation.x=-flap;
  }

  // 尾巴摆动
  const sw=Math.sin(t*2)*0.2;
  bull.tail.rotation.z=sw+0.1; mom.tail.rotation.z=sw+0.1; if(dad.g.visible) dad.tail.rotation.z=sw+0.1;

  // 撞树：一次性音效 + 抖动 + 「哐!!」
  if(t>25.0 && t<26.3 && !boomed){ boomed=true; thud(); }
  if(t>=25.05 && t<26.0) boomEl.style.opacity=1; else boomEl.style.opacity=0;

  // 运镜（含撞树抖动）
  let cam=sample(CAM,t);
  let px=cam.p[0],py=cam.p[1],pz=cam.p[2];
  if(t>25.0 && t<26.4){ const s=(26.4-t)*0.5; px+=(Math.random()-0.5)*s; py+=(Math.random()-0.5)*s; }
  if(ui.playing){
    camera.position.set(px,py,pz); camera.lookAt(...cam.l);
  } else { controls.update(); }

  // 字幕
  let active=null;
  for(const s of SCRIPT){ if(t>=s.t0 && t<=s.t1){ active=s; break; } }
  if(active){
    subEl.className='sub '+active.who+(active.punch?' punch':'');
    subEl.innerHTML='<span class="who">'+WHO[active.who]+'</span>'+active.text;
    subEl.style.opacity=1;
  } else subEl.style.opacity=0;

  // 片头 / 片尾
  const ti = (t>0.6 && t<3.4)? Math.min(1,(t-0.6)/0.6,(3.4-t)/0.6) : (t>=3.4?0:1);
  titleEl.style.opacity = ti>0.05?ti:0;
  endEl.style.opacity = t>37? Math.min(1,(t-37)/1.4):0;

  progEl.style.width=(t/TOTAL*100)+'%';
  tlab.textContent = t.toFixed(1)+' / '+TOTAL+'s';

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
} catch(err){
  console.error(err);
  document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ff5d5d;z-index:99;text-align:center;padding:30px">初始化失败：'+(err&&err.message?err.message:err)+'<br>请用本地 HTTP 服务器打开（见 README）。</div>');
}
</script>
